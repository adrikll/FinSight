version: '3.8'

services:
  finsight-api:
    build: .
    container_name: finsight_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - KEY_VAULT_URL=https://kv-finsight-ak2026.vault.azure.net/
      - AZURE_BLOB_CONTAINER=finsight-artifacts
    restart: always

  postgres:
    image: postgres:15
    container_name: finsight_postgres
    environment:
      POSTGRES_USER: finsight_user
      POSTGRES_PASSWORD: finsight_password
      POSTGRES_DB: finsight_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    container_name: finsight_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: