name: Atualizacao Mensal do Dashboard (FinSight)

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  atualizar-dados-mensais:
    name: Sincronizar APIs do BCB e Banco Azure
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias Completa
        run: |
          python -m pip install --upgrade pip
          pip install pandas polars psycopg2-binary requests pyarrow fastparquet pymongo

      - name: 1. Inicializar Tabelas
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python init_db.py

      - name: 2. Macro Loader
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python macro_loader.py

      - name: 3. BCB Prep (Atencao - Baixa arquivos pesados)
        run: python bcb_data_prep.py

      - name: 4. BCB Load
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python bcb_data_load.py

      - name: 5. Fraud Prep
        run: python fraud_data_prep.py

      - name: 6. Fraud Load
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python fraud_data_load.py